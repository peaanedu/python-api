services:
  nginx:
    image: nginx:latest
    container_name: api-gateway-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - products-service
      - orders-service
      - customers-service

  products-service:
    build: ./products-service
    container_name: products-service
    environment:
      DB_HOST: postgres
      DB_NAME: products_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - postgres

  orders-service:
    build: ./orders-service
    container_name: orders-service
    environment:
      DB_HOST: postgres
      DB_NAME: orders_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - postgres

  customers-service:
    build: ./customers-service
    container_name: customers-service
    environment:
      DB_HOST: postgres
      DB_NAME: customers_db
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: